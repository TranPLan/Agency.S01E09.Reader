.\nSo you're done handing over your work?\nWell… Today's the presentation, so I'll have to wrap that up.\nSo you won't go to work starting tomorrow, right?\nWhat? Well…\nI mean… Yes, you can say that.\nBut I guess it's totally okay to conclude that you're not incorrect.","text":"Ơ kìa? Mẹ. A Ji, sao con không đi học?\nThằng bé hơi cảm nên mẹ cho ở nhà.\nVậy ạ.\nMẹ bàn giao công việc xong rồi chứ?\nChuyện đó… Hôm nay là ngày đấu thầu, mẹ phải lo nốt vụ đó.\nVậy từ mai mẹ không đi làm nữa nhỉ?\nHả? Chuyện đó…\nThì…… Ừ, có thể nói là như vậy.\nBảo là con nói không sai cũng không phải là không có lý…\n송아지, 조은정: 어? 엄마 아지, 왜 유치원 안 갔어?\n조은정: 어, 감기 기운 살짝 있어서 안 보냈다\n조은정: 아, 그래요?\n송아지: 이제 인수인수 끝났지?\n조은정: 음, 그게…\n조은정: 오, 오늘 PT야 어, PT 끝나야 끝나지\n송아지: 그럼 내일부터 회사 안 가는 거지?\n조은정: 어? 그게, 그…\n조은정: 어, 어, 뭐 그렇다고도 할 수 있지만 또, 그\n조은정: 씁, 아니지 않다고 하기에도\n조은정: 크게 무리가 없진 않지 않은가 싶기도 한데…\nWhat? Mom. A-ji, why aren't you at kindergarten?\nHe's coming down with a cold, so I made him stay.\nI see.\nSo you're done handing over your work?\nWell… Today's the presentation, so I'll have to wrap that up.\nSo you won't go to work starting tomorrow, right?\nWhat? Well…\nI mean… Yes, you can say that.\nBut I guess it's totally okay to conclude that you're not incorrect.","sourceUid":"merged-mwnj4a4o-71","sourceNo":101,"viRanges":[{"start":361.735,"end":402.905}],"koRanges":[{"start":400.930342,"end":443.120841}]},{"id":63,"readerNo":64,"displayNo":64,"n":64,"kind":"sub","type":"merged","vi":"[Giọng bối rối của Aji]\n[Tiếng mở cửa]\n[Jungsuk] À… [Tiếng đóng cửa]","ko":"[아지의 의아한 소리]\n[문 열리는 소리]\n[정숙] 참… [문 닫히는 소리]\n[긴장되는 음악]","en":"[Aji’s puzzled voice]\n[Sound of door opening]\n[Jungsuk] Well… [Sound of door closing]","text":"[Giọng bối rối của Aji]\n[Tiếng mở cửa]\n[Jungsuk] À… [Tiếng đóng cửa]\n[아지의 의아한 소리]\n[문 열리는 소리]\n[정숙] 참… [문 닫히는 소리]\n[긴장되는 음악]\n[Aji’s puzzled voice]\n[Sound of door opening]\n[Jungsuk] Well… [Sound of door closing]","sourceUid":"merged-mwnj6h7j-72","sourceNo":106,"viRanges":[],"koRanges i đang thì thầm]\n[사람들이 웅성거린다]\n[People are murmuring]","sourceUid":"ko-mwmzdkza-438","sourceNo":438,"viRanges":[],"koRanges":[]},{"id":258,"readerNo":259,"displayNo":259,"n":259,"kind":"sub","type":"merged","vi":"Hai mươi ba năm trước, tôi là kẻ giết người.","ko":"근데 2, 23년을 돈으로 어떻게 보상합니까","en":"It ruled me as a murderer 23 years ago.","text":"Hai mươi ba năm trước, tôi là kẻ giết người.\n근데 2, 23년을 돈으로 어떻게 보상합니까\nIt ruled me as a murderer 23 years ago.","sourceUid":"merged-mwp1t80v-228","sourceNo":442,"viRanges":[{"start":1773.225,"end":1777.027268}],"koRanges":[{"start":1828.069866,"end":1836.221}]},{"id":259,"readerNo":260,"displayNo":260,"n":260,"kind":"sub","type":"merged","vi":"Còn bây giờ thì không.","ko":"결혼했더라고요","en":"But it says otherwise now.","text":"Còn bây giờ thì không.\n결혼했더라고요\nBut it says otherwise now.","sourceUid":"merged-mwp1u0h6-229","sourceNo":443,"viRanges":[{"start":1778.605,"end":1780.195}],"koRanges":[{"start":1837.391,"end":1840.021}]},{"id":260,"readerNo":261,"displayNo":261,"n":261,"kind":"sub","type":"merged","vi":"Xem này. - Rốt cuộc luật pháp là gì?\nMà lúc nói thế này, lúc nói thế khác.\nHọ bảo sẽ bồi thường cho tôi.\nNhưng…\ntiền làm sao có thể\nbồi thường cho 23 năm của tôi?","ko":"어, 얼마면…\n도대체 얼마면\n년\n년에서 하나, 둘, 셋\n년이나 더한 23년 동안\n징역을 살았는데\n무죄다?","en":"Look at this. -What even is law?\nIt goes back and forth so easily.\nThey say they'll pay me compensation.\nBut…\nhow can money compensate\nfor the 23 years that I lost?","text":"Xem này. - Rốt cuộc luật pháp là gì?\nMà lúc nói thế này, lúc nói thế khác.\nHọ bảo sẽ bồi thường cho tôi.\nNhưng…\ntiền làm sao có thể\nbồi thường cho 23 năm của tôi?\n어, 얼마면…\n도대체 얼마면\n년\n년에서 하나, 둘, 셋\n년이나 더한 23년 동안\n징역을 살았는데\n무죄다?\nLook at this. -What even is law?\nIt goes back and forth so easily.\nThey say they'll pay me compensation.\nBut…\nhow can money compensate\nfor the 23 years that I lost?","sourceUid":"merged-mwp1xgvs-235","sourceNo":450,"viRanges":[{"start":1780.2749999999999,"end":1795.0049999999999}],"koRanges":[{"start":1840.931,"end":1869.251}]},{"id":261,"readerNo":262,"displayNo":262,"n":262,"kind":"sub","type":"merged","vi":"Con gái tôi kết hôn rồi.\nBao nhiêu tiền…\nBao nhiêu tiền mới bù đắp được…\ncho chừng ấy năm tôi không được chứng kiến\ncon gái mình lớn lên?","ko":"이 문제의 원인이 바로 구속 수사\n구속 수사 라고 주장하시는 분이 계시는데요\n이 사건 담당하신 재심 전문\n최영재 변호사님 모셨습니다\n반갑습니다","en":"My daughter got married.\nHow much…\nHow much money can they give me…\nto compensate for the time\nthat I lost with my daughter?","text":"Con gái tôi kết hôn rồi.\nBao nhiêu tiền…\nBao nhiêu tiền mới bù đắp được…\ncho chừng ấy năm tôi không được chứng kiến\ncon gái mình lớn lên?\n이 문제의 원인이 바로 구속 수사\n구속 수사 라고 주장하시는 분이 계시는데요\n이 사건 담당하신 재심 전문\n최영재 변호사님 모셨습니다\n반갑습니다\nMy daughter got married.\nHow much…\nHow much money can they give me…\nto compensate for the time\nthat I lost with my daughter?","sourceUid":"merged-mwp20wmv-246","sourceNo":456,"viRanges":[{"start":1796.965,"end":1810.975}],"koRanges":[{"start":1870.0910000000001,"end":1886.351}]},{"id":262,"readerNo":263,"displayNo":263,"n":263,"kind":"sub","type":"merged","vi":"Hai mươi ba năm.\nHai mươi năm\ncộng thêm một, hai, ba năm nữa.\nThêm ba năm nữa.\nVậy là anh ấy đã sống trong tù\ntổng cộng 23 năm.","ko":"","en":"Twenty-three years.\nThat's twenty years\nplus one, two, three years.\nThree additional years.\nSo he had served his sentence\nfor 23 years.","text":"Hai mươi ba năm.\nHai mươi năm\ncộng thêm một, hai, ba năm nữa.\nThêm ba năm nữa.\nVậy là anh ấy đã sống trong tù\ntổng cộng 23 năm.\nTwenty-three years.\nThat's twenty years\nplus one, two, three years.\nThree additional years.\nSo he had served his sentence\nfor 23 years.","sourceUid":"merged-mwp20pav-245","sourceNo":397,"viRanges":[{"start":1812.725,"end":1826.445}],"koRanges":[]},{"id":263,"readerNo":264,"displayNo":264,"n":264,"kind":"sub","type":"ko","vi":"[Cúp máy hết lần này đến lần khác]","ko":"[또박또박 끊어서]","en":"[Hangs up again and again]","text":"[Cúp máy hết lần này đến lần khác]\n[또박또박 끊어서]\n[Hangs up again and again]","sourceUid":"ko-mwmzdkza-452","sourceNo":452,"viRanges":[],"koRanges":[]},{"id":264,"readerNo":265,"displayNo":265,"n":265,"kind":"sub","type":"merged","vi":"Nhưng lại là vô tội!\nNguyên nhân của vấn đề này chính là điều tra tạm giam.\nĐiều tra tạm giam!\nCó một người đã khẳng định đó chính là nguyên nhân.\nChúng tôi đã mời đến đây luật sư phúc thẩm,\nanh Choi Yeong Jae.","ko":"","en":"But he was ruled innocent!\nThis problem was caused by investigative detention.\nInvestigative detention!\nThere's someone who claims that this is what caused the problem.\nWe have with us today Mr. Choi Yeong-jae,\nanh Choi Yeong Jae.\nan appellate lawyer.","text":"Nhưng lại là vô tội!\nNguyên nhân của vấn đề này chính là điều tra tạm giam.\nĐiều tra tạm giam!\nCó một người đã khẳng định đó chính là nguyên nhân.\nChúng tôi đã mời đến đây luật sư phúc thẩm,\nanh Choi Yeong Jae.\nBut he was ruled innocent!\nThis problem was caused by investigative detention.\nInvestigative detention!\nThere's someone who claims that this is what caused the problem.\nWe have with us today Mr. Choi Yeong-jae,\nanh Choi Yeong Jae.\nan appellate lawyer.","sourceUid":"merged-mwp24tmo-251","sourceNo":401,"viRanges":[{"start":1827.0349999999999,"end":1844.0049999999999}],"koRanges":[]},{"id":265,"readerNo":266,"displayNo":266,"n":266,"kind":"sub","type":"merged","vi":"Rất vui được gặp anh.\nVâng, chào quý vị.","ko":"네, 안녕하십니까","en":"Hello, sir.\nHello.","text":"Rất vui được gặp anh.\nVâng, chào quý vị.\n네, 안녕하십니까\nHello, sir.\nHello.","sourceUid":"merged-mwp25ejp-252","sourceNo":457,"viRanges":[{"start":1844.095,"end":1846.885}],"koRanges":[{"start":1886.191,"end":1887.981}]},{"id":266,"readerNo":267,"displayNo":267,"n":267,"kind":"sub","type":"vi","vi":"BẢN TIN CHIẾN BINH","ko":"","en":"","text":"BẢN TIN CHIẾN BINH","sourceUid":"vi-mwn0okd8-402","sourceNo":402,"viRanges":[{"start":1828.655,"end":1829.575}],"koRanges":[]},{"id":267,"readerNo":268,"displayNo":268,"n":268,"kind":"sub","type":"merged","vi":"So với các nước tiên tiến châu Âu,\ntỷ lệ bắt tạm giam ở Hàn Quốc vẫn còn quá cao.","ko":"아, 유럽 선진국에 비해\n우리나라는 구속 비중이 아직 너무 높습니다","en":"Compared to the more advanced European countries,\nKorea still has a very high rate of detainment.","text":"So với các nước tiên tiến châu Âu,\ntỷ lệ bắt tạm giam ở Hàn Quốc vẫn còn quá cao.\n아, 유럽 선진국에 비해\n우리나라는 구속 비중이 아직 너무 높습니다\nCompared to the more advanced European countries,\nKorea still has a very high rate of detainment.","sourceUid":"merged-mwp23x3s-250","sourceNo":459,"viRanges":[{"start":1847.385,"end":1851.685}],"koRanges":[{"start":1887.8110000000001,"end":1892.191}]},{"id":268,"readerNo":269,"displayNo":269,"n":269,"kind":"sub","type":"merged","vi":"Như một kiểu ghi bàn để điều tra thuận tiện hơn.\nĐó là một từ lóng của công tố viên.\n\"Ghi bàn\"?\nCó nghĩa là bắt tạm giam.\nGhi bàn!","ko":"일명 골인시키고 편하게 조사하겠다는 건데요\n씁, 골인이라면?\n아, 검사들의 은어인데\n구속시킨 걸 골인이라고 합니다","en":"It's a practice so-called, \"scoring a goal,\" for easy investigation.\n\"Scoring a goal\"?\nIt's slang used by the prosecutors.\nIt means you've detained someone.\nScoring a goal!","text":"Như một kiểu ghi bàn để điều tra thuận tiện hơn.\nĐó là một từ lóng của công tố viên.\n\"Ghi bàn\"?\nCó nghĩa là bắt tạm giam.\nGhi bàn!\n일명 골인시키고 편하게 조사하겠다는 건데요\n씁, 골인이라면?\n아, 검사들의 은어인데\n구속시킨 걸 골인이라고 합니다\nIt's a practice so-called, \"scoring a goal,\" for easy investigation.\n\"Scoring a goal\"?\nIt's slang used by the prosecutors.\nIt means you've detained someone.\nScoring a goal!","sourceUid":"merged-mwp27tv6-258","sourceNo":463,"viRanges":[{"start":1851.7649999999999,"end":1860.8149999999998}],"koRanges":[{"start":1892.031,"end":1900.281}]},{"id":269,"readerNo":270,"displayNo":270,"n":270,"kind":"sub","type":"merged","vi":"Nhờ anh duy trì sức nóng đến đêm nay.\nChẳng phải quá là phi nhân đạo sao? Vâng.\nNghe nói các anh đã cho thăm dò dư luận rồi.\nNgày mai chúng tôi sẽ bắt đầu.","ko":"골인이요?\n오늘 밤까진 자극적으로 방송해 주세요\n여론 조사 시작했다고 들었는데요\n내일부터 시작합니다","en":"Please keep the show stimulating until tonight.\nIsn't that too inhumane? Yes, sir.\nI hear you've started the public opinion polls.\nIt starts tomorrow.","text":"Nhờ anh duy trì sức nóng đến đêm nay.\nChẳng phải quá là phi nhân đạo sao? Vâng.\nNghe nói các anh đã cho thăm dò dư luận rồi.\nNgày mai chúng tôi sẽ bắt đầu.\n골인이요?\n오늘 밤까진 자극적으로 방송해 주세요\n여론 조사 시작했다고 들었는데요\n내일부터 시작합니다\nPlease keep the show stimulating until tonight.\nIsn't that too inhumane? Yes, sir.\nI hear you've started the public opinion polls.\nIt starts tomorrow.","sourceUid":"merged-mwp29tk3-263","sourceNo":468,"viRanges":[{"start":1860.895,"end":1869.495}],"koRanges":[{"start":1900.121,"end":1910.131}]},{"id":270,"readerNo":271,"displayNo":271,"n":271,"kind":"sub","type":"ko","vi":"[Âm thanh tiếp tục của tiến trình] [Trình quản lý báo cáo] Vâng, tôi…","ko":"[계속되는 진행 소리] [보도 본부장] 예, 저…","en":"[Continued sound of progress] [Report Manager] Yes, I…","text":"[Âm thanh tiếp tục của tiến trình] [Trình quản lý báo cáo] Vâng, tôi…\n[계속되는 진행 소리] [보도 본부장] 예, 저…\n[Continued sound of progress] [Report Manager] Yes, I…","sourceUid":"ko-mwmzdkzb-466","sourceNo":466,"viRanges":[],"koRanges":[]},{"id":271,"readerNo":272,"displayNo":272,"n":272,"kind":"sub","type":"merged","vi":"Tôi hiểu rồi. Vậy có nghĩa là…\nVậy lượng quảng cáo thì…\nChỉ để thêm vào ý của công tố viên…\nChúng tôi sẽ phủ sóng hết cỡ.\nCảm ơn anh.","ko":"알겠습니다\n그, 광고 물량은…\n꽉 채워 드리겠습니다\n감사합니다","en":"I see. Then that means…\nAbout the number of ads…\nIt's just to add to the prosecutor's…\nWe will have the maximum amount.\nThank you, sir.","text":"Tôi hiểu rồi. Vậy có nghĩa là…\nVậy lượng quảng cáo thì…\nChỉ để thêm vào ý của công tố viên…\nChúng tôi sẽ phủ sóng hết cỡ.\nCảm ơn anh.\n알겠습니다\n그, 광고 물량은…\n꽉 채워 드리겠습니다\n감사합니다\nI see. Then that means…\nAbout the number of ads…\nIt's just to add to the prosecutor's…\nWe will have the maximum amount.\nThank you, sir.","sourceUid":"merged-mwp2bk3p-267","sourceNo":472,"viRange ,"displayNo":284,"n":284,"kind":"sub","type":"merged","vi":"Anh nói đúng.\nTrên đời này không có điều gì hoàn hảo tuyệt đối cả.\nVà trên đời này cũng không có điều gì hoàn toàn là bất biến.\nVới ý nghĩa đó, thay mặt toàn bộ đoàn thẩm phán,\ntôi xin chân thành xin lỗi về những sai sót trong quá khứ.","ko":"예, 그렇죠, 예\n세상에 완전무결한 것은 존재하지 않습니다\n세상엔 변하지 않는 것도 존재하지 않습니다\n더하여 법조인을 대표해서\n과거 실수에 대해서 사과드립니다","en":"That's right, sir.\nThere's nothing in this world that is absolutely perfect.\nThere's also nothing in this world that can't change.\nIn light of such a notion, I'd like to offer my sincere apology\nfor our past mistakes on behalf of all the judiciaries.","text":"Anh nói đúng.\nTrên đời này không có điều gì hoàn hảo tuyệt đối cả.\nVà trên đời này cũng không có điều gì hoàn toàn là bất biến.\nVới ý nghĩa đó, thay mặt toàn bộ đoàn thẩm phán,\ntôi xin chân thành xin lỗi về những sai sót trong quá khứ.\n예, 그렇죠, 예\n세상에 완전무결한 것은 존재하지 않습니다\n세상엔 변하지 않는 것도 존재하지 않습니다\n더하여 법조인을 대표해서\n과거 실수에 대해서 사과드립니다\nThat's right, sir.\nThere's nothing in this world that is absolutely perfect.\nThere's also nothing in this world that can't change.\nIn light of such a notion, I'd like to offer my sincere apology\nfor our past mistakes on behalf of all the judiciaries.","sourceUid":"merged-mws0xc4v-183","sourceNo":493,"viRanges":[{"start":1947.5249999999999,"end":1968.425}],"koRanges":[{"start":1987.911,"end":2009.101}]},{"id":284,"readerNo":285,"displayNo":285,"n":285,"kind":"sub","type":"merged","vi":"TÁM TRÊN MƯỜI CÔNG DÂN PHẢN ĐỐI ĐIỀU TRA GIAM GIỮ…\n…CÔNG CHÚNG PHẢN ĐỐI ĐIỀU TRA GIAM GIỮ\nĐỘI TRƯỞNG ĐỘI PHÁP LÝ BAE JEONG HYEON","ko":"","en":"EIGHT OUT OF TEN CITIZENS SAY NO TO INVESTIGATIVE DETENTIONS…\n…THE PUBLIC SAYS NO TO INVESTIGATIVE DETENTIONS\nHEAD OF THE LEGAL TEAM BAE JEONG-HYEON","text":"TÁM TRÊN MƯỜI CÔNG DÂN PHẢN ĐỐI ĐIỀU TRA GIAM GIỮ…\n…CÔNG CHÚNG PHẢN ĐỐI ĐIỀU TRA GIAM GIỮ\nĐỘI TRƯỞNG ĐỘI PHÁP LÝ BAE JEONG HYEON\nEIGHT OUT OF TEN CITIZENS SAY NO TO INVESTIGATIVE DETENTIONS…\ let idx=0,stop=false,viUrl='',koUrl='',unlocked=false,token=0;
const $=id=>document.getElementById(id);
const engine=()=>$('engine');
function toggleSettings(){const p=$('settingsPanel');if(p)p.classList.toggle('show')}
let audioCtx=null,gainNode=null,mediaSource=null,engineKind='vi';
const VOL_KEY='master_reader_volume_'+String(project.githubSlug||project.title||'reader').replace(/[^A-Za-z0-9._-]+/g,'_');

function esc2(s){return String(s||'').replace(/[&<>"']/g,function(m){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]})}
function fmt(t){t=Number(t||0);let h=Math.floor(t/3600),m=Math.floor((t%3600)/60),s=Math.floor(t%60),ms=Math.round((t-Math.floor(t))*1000);if(ms>=1000){s++;ms-=1000}return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+','+String(ms).padStart(3,'0')}
function rangeLabel(arr){if(!arr||!arr.length)return '';let a=arr[0],b=arr[arr.length-1];return fmt(a.start)+' → '+fmt(b.end)+(arr.length>1?' x'+arr.length:'')}
function hasRange(k,b){let arr=k==='vi'?b.viRanges:b.koRanges;return !!(arr&&arr.length)}
function folderPath(){let f=String(project.audioFolder||'audio').trim();while(f.endsWith('/'))f=f.slice(0,-1);return f||'audio'}
function pathFor(k){let folder=folderPath();let file=k==='vi'?project.viAudioFile:project.koAudioFile;if(!file)return '';if(file.startsWith('http://')||file.startsWith('https://'))return file;if(folder==='.'||folder==='')return './'+file;if(folder.startsWith('../')||folder.startsWith('./'))return folder+'/'+file;return './'+folder+'/'+file}
function clampVol(v){v=Number(v);if(!Number.isFinite(v))v=100;return Math.max(0,Math.min(200,v))}
function loadVolSettings(){try{return JSON.parse(localStorage.getItem(VOL_KEY)||'{}')||{}}catch(e){return {}}}
function saveVolSettings(){try{localStorage.setItem(VOL_KEY,JSON.stringify({vi:clampVol($('viVol')?.value||100),ko:clampVol($('koVol')?.value||100)}))}catch(e){}}
function volValue(k){return clampVol($(k+'Vol')?.value||100)}
function ensureGain(){
  try{
    const a=engine();
    if(!audioCtx)audioCtx=new (window.AudioContext||window.webkitAudioContext)();
    if(!mediaSource){
      mediaSource=audioCtx.createMediaElementSource(a);
      gainNode=audioCtx.createGain();
      mediaSource.connect(gainNode);
      gainNode.connect(audioCtx.destination);
    }
    if(audioCtx.state==='suspended')audioCtx.resume().catch(()=>{});
    return true;
  }catch(e){return false}
}
function applyVisibleVolume(k){
  const v=volValue(k), label=$(k+'VolLabel');
  if(label)label.textContent=Math.round(v)+'%';
}
function applyEngineVolume(k){
  engineKind=k||engineKind||'vi';
  const v=volValue(engineKind), a=engine();
  const ok=ensureGain();
  if(ok&&gainNode){a.volume=1;gainNode.gain.value=v/100}
  else a.volume=Math.min(1,v/100);
  applyVisibleVolume(engineKind);
}
function setReaderVolume(k,v,persist=true){
  const slider=$(k+'Vol');
  if(slider)slider.value=String(clampVol(v));
  applyVisibleVolume(k);
  if(engineKind===k)applyEngineVolume(k);
  if(persist)saveVolSettings();
}
function initReaderVolumeControls(){
  const saved=loadVolSettings();
  ['vi','ko'].forEach(k=>{
    const slider=$(k+'Vol');
    const val=clampVol(saved[k]??100);
    if(slider){
      slider.value=String(val);
      slider.oninput=()=>setReaderVolume(k,slider.value,true);
      slider.onchange=()=>setReaderVolume(k,slider.value,true);
    }
    setReaderVolume(k,val,false);
  });
}
function loadPaths(){viUrl=pathFor('vi');koUrl=pathFor('ko');applyVisibleVolume('vi');applyVisibleVolume('ko');$('audioInfo').textContent='Paths: '+viUrl+' | '+koUrl}
function showAudioPaths(){alert('VI: '+viUrl+'\nKO: '+koUrl+'\n\nNếu đặt reader trong thư mục subtitle-master, audio folder thường là ../audio.')}
function loadLocal(k,f){if(!f)return;if(k==='vi')viUrl=URL.createObjectURL(f);else koUrl=URL.createObjectURL(f);applyVisibleVolume(k);$('audioInfo').textContent='Loaded local '+k+': '+f.name}
function toggleAudio(){toggleSettings()}

function badgeHtml(b){
  const vi=hasRange('vi',b)?'<span class="badge vi timingBadge">VI '+rangeLabel(b.viRanges)+'</span>':'<span class="badge no">No VI</span>';
  const ko=hasRange('ko',b)?'<span class="badge vi timingBadge">KO '+rangeLabel(b.koRanges)+'</span>':'<span class="badge no">No KO</span>';
  const type=b.kind==='narration'?'<span class="badge narr">Narration</span>':'<span class="badge">Cue</span>';
  return '<div class="badges">'+type+vi+ko+'</div>';
}
function render(){
  const q=($('q').value||'').toLowerCase();
  let h='';
  project.blocks.forEach(function(b,i){
    const hay=[b.vi,b.ko,b.en,b.text,b.displayNo,b.sourceNo].join(' ').toLowerCase();
    if(q&&!hay.includes(q))return;
    const title=(b.kind==='narration'?'Narration #':'Cue #')+(b.displayNo||b.sourceNo||i+1);
    h+='<div class="item '+(b.kind==='narration'?'narr':'')+' '+(i===idx?'active':'')+'" onclick="idx='+i+';render()">';
    h+='<div class="meta"><span>'+esc2(title)+'</span><span>'+(i===idx?'SELECTED':'')+'</span></div>';
    h+=badgeHtml(b);
    h+='<div class="txt">'+(b.vi?'<div>'+esc2(b.vi)+'</div>':'')+(b.ko?'<div class="ko">'+esc2(b.ko)+'</div>':'')+(b.en?'<div class="en">'+esc2(b.en)+'</div>':'')+'</div>';
    h+='<div class="row" style="margin-top:8px"><button onclick="event.stopPropagation();idx='+i+';readKoCurrent()">Read KO</button><button class="good" onclick="event.stopPropagation();idx='+i+';playCurrent(\'vi\')">VI Dub</button><button class="violet" onclick="event.stopPropagation();idx='+i+';playCurrent(\'ko\')">KO Live</button><button class="warn" onclick="event.stopPropagation();idx='+i+';playCueMode()">VI→VI→KO→KO</button></div>';
    h+='</div>';
  });
  $('list').innerHTML=h||'<div class="item">Không có cue phù hợp.</div>';
  const viCount=project.blocks.filter(b=>hasRange('vi',b)).length, koCount=project.blocks.filter(b=>hasRange('ko',b)).length;
  $('stat').textContent=project.blocks.length+' blocks · VI '+viCount+' · KO '+koCount+' · current '+(idx+1);
}
function cur(){return project.blocks[idx]||{}}
function prev(){idx=Math.max(0,idx-1);render();scrollActive()}
function next(){idx=Math.min(project.blocks.length-1,idx+1);render();scrollActive()}
function scrollActive(){document.querySelector('.item.active')?.scrollIntoView({block:'center',behavior:'smooth'})}
function stopAll(){stop=true;token++;engine().pause();try{speechSynthesis.cancel()}catch(e){}}

function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function waitMedia(a,timeout){timeout=timeout||6000;return new Promise(res=>{if(a.readyState>=1)return res(true);let done=false;function ok(){if(done)return;done=true;clean();res(true)}function bad(){if(done)return;done=true;clean();res(false)}function clean(){a.removeEventListener('loadedmetadata',ok);a.removeEventListener('canplay',ok);a.removeEventListener('error',bad);clearTimeout(to)}a.addEventListener('loadedmetadata',ok,{once:true});a.addEventListener('canplay',ok,{once:true});a.addEventListener('error',bad,{once:true});let to=setTimeout(bad,timeout)})}
async function unlockAudio(){try{let a=engine();let src=viUrl||koUrl||pathFor('vi')||pathFor('ko');if(!src){alert('Chưa có audio path.');return false}if(a.src!==new URL(src,location.href).href){a.src=src;a.load();await waitMedia(a,5000)}let vol=a.volume;a.volume=0.001;await a.play();a.pause();a.volume=vol||1;applyEngineVolume(engineKind||'vi');unlocked=true;$('audioInfo').textContent+=' | unlocked';return true}catch(e){alert('iPhone chưa cho unlock audio. Bấm lại Unlock iPhone Audio. '+(e.message||e));return false}}
function playRange(src,r,myToken,k){
  return new Promise(async res=>{
    if(!src||!r){res(false);return}
    const a=engine();stop=false;
    try{
      const abs=new URL(src,location.href).href;
      if(a.src!==abs){a.pause();a.src=src;a.load();await waitMedia(a,7000)}
      applyEngineVolume(k||'vi');
      a.currentTime=Math.max(0,Number(r.start)||0);
      const end=Math.max(Number(r.end)||0,(Number(r.start)||0)+.2);
      function finish(ok){a.removeEventListener('timeupdate',tick);a.removeEventListener('ended',ended);a.removeEventListener('error',err);res(ok)}
      function tick(){if(stop||myToken!==token){a.pause();finish(false);return}if(a.currentTime>=end-0.03){a.pause();finish(true)}}
      function ended(){finish(true)} function err(){finish(false)}
      a.addEventListener('timeupdate',tick);a.addEventListener('ended',ended,{once:true});a.addEventListener('error',err,{once:true});
      await a.play();
    }catch(e){$('audioInfo').textContent='Không phát được audio: '+(e.message||e)+' | '+src;res(false)}
  })
}
async function playAudioKind(k,myToken){
  const b=cur();const ranges=k==='vi'?b.viRanges:b.koRanges;const src=k==='vi'?viUrl:koUrl;
  if(!ranges||!ranges.length)return false;
  let any=false;
  for(const r of ranges){if(stop||myToken!==token)break;let ok=await playRange(src,r,myToken,k);any=any||ok}
  return any;
}
async function playCurrent(k){const my=++token;stop=false;const ok=await playAudioKind(k,my);if(!ok)await readKoCurrent()}

function getBestVoice(lang){
  try{
    const voices=speechSynthesis.getVoices()||[];
    const prefix=String(lang||'').slice(0,2).toLowerCase();
    const scored=voices.map(v=>{
      const hay=((v.lang||'')+' '+(v.name||'')).toLowerCase();
      let score=0;
      if((v.lang||'').toLowerCase().startsWith(prefix))score+=100;
      if(lang==='ko-KR' && /ko|korean|한국|yuna|siri|google|microsoft|samsung|premium|enhanced/.test(hay))score+=60;
      if(lang==='vi-VN' && /vi|vietnam|tiếng việt|vietnamese|google|microsoft|premium|enhanced/.test(hay))score+=60;
      if(v.localService)score+=5;
      return {v,score};
    }).filter(x=>x.score>0).sort((a,b)=>b.score-a.score);
    return scored[0]?.v||null;
  }catch(e){return null}
}
function readTts(text,lang,myToken,rate){
  return new Promise(res=>{
    text=String(text||'').trim();
    if(!text){res(false);return}
    try{
      speechSynthesis.cancel();
      const u=new SpeechSynthesisUtterance(text.slice(0,1200));
      u.lang=lang;
      u.rate=rate||1;
      u.pitch=1;
      const v=getBestVoice(lang); if(v)u.voice=v;
      let done=false;
      function finish(ok){if(done)return;done=true;res(ok)}
      u.onend=()=>finish(true);u.onerror=()=>finish(false);
      speechSynthesis.speak(u);
      setTimeout(()=>{if(myToken!==token){speechSynthesis.cancel();finish(false)}},50);
    }catch(e){res(false)}
  })
}
function readKo(text,myToken){return readTts(text,'ko-KR',myToken,0.88)}
function readVi(text,myToken){return readTts(text,'vi-VN',myToken,0.95)}
function readKoCurrent(){const my=++token;stop=false;return readKo(cur().ko||cur().text||'',my)}
function readViCurrent(){const my=++token;stop=false;return readVi(cur().vi||'',my)}
if('speechSynthesis' in window){speechSynthesis.onvoiceschanged=()=>{try{speechSynthesis.getVoices()}catch(e){}}}

async function playByModeForCurrent(mode,my){
  const b=cur();
  const hasVi=hasRange('vi',b), hasKo=hasRange('ko',b);
  if(mode==='vi-readvi-readko-ko'){
    if(hasVi) await playAudioKind('vi',my); else await readVi(b.vi||'',my);
    if(stop||my!==token)return;
    await readKo(b.ko||b.text||'',my);
    if(stop||my!==token)return;
    if(hasKo) await playAudioKind('ko',my);
  }else if(mode==='vi-readko-ko'){
    if(hasVi) await playAudioKind('vi',my);
    if(stop||my!==token)return;
    await readKo(b.ko||b.text||'',my);
    if(stop||my!==token)return;
    if(hasKo) await playAudioKind('ko',my);
  }else if(mode==='vi-ko'){
    if(hasVi)await playAudioKind('vi',my);
    if(stop||my!==token)return;
    if(hasKo)await playAudioKind('ko',my);
    else if(!hasVi)await readKo(b.ko||b.text||'',my);
  }else if(mode==='vi'){
    const ok=await playAudioKind('vi',my);
    if(!ok)await readVi(b.vi||'',my);
  }else if(mode==='ko'){
    const ok=await playAudioKind('ko',my);
    if(!ok)await readKo(b.ko||b.text||'',my);
  }else if(mode==='readko'){
    await readKo(b.ko||b.text||'',my);
  }
}
async function playCueMode(){
  const my=++token;stop=false;
  await playByModeForCurrent($('mode').value,my);
}
async function smart(){
  stop=false;const my=++token;
  const mode=$('mode').value;
  if((mode==='vi-readko-ko'||mode==='vi-readvi-readko-ko')&&!unlocked&&/iPad|iPhone|iPod/.test(navigator.userAgent)){await unlockAudio()}
  for(;idx<project.blocks.length&&my===token&&!stop;idx++){
    render();scrollActive();
    await playByModeForCurrent(mode,my);
    if(stop||my!==token)break;
  }
}
initReaderVolumeControls();loadPaths();render();
