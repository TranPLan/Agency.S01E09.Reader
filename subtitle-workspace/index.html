y to conclude that you're not incorrect.","text":"Ơ kìa? Mẹ. A Ji, sao con không đi học?\nThằng bé hơi cảm nên mẹ cho ở nhà.\nVậy ạ.\nMẹ bàn giao công việc xong rồi chứ?\nChuyện đó… Hôm nay là ngày đấu thầu, mẹ phải lo nốt vụ đó.\nVậy từ mai mẹ không đi làm nữa nhỉ?\nHả? Chuyện đó…\nThì…… Ừ, có thể nói là như vậy.\nBảo là con nói không sai cũng không phải là không có lý…\\n송아지, 조은정:  어? 엄마 아지, 왜 유치원 안 갔어?\n조은정:  어, 감기 기운 살짝 있어서 안 보냈다\n조은정:  아, 그래요?\n송아지:  이제 인수인수 끝났지?\n조은정:  음, 그게…\n조은정:  오, 오늘 PT야 어, PT 끝나야 끝나지\n송아지:  그럼 내일부터 회사 안 가는 거지?\n조은정:  어? 그게, 그…\n조은정:  어, 어, 뭐 그렇다고도 할 수 있지만 또, 그\n조은정:  씁, 아니지 않다고 하기에도\n조은정:  크게 무리가 없진 않지 않은가 싶기도 한데…\\nWhat? Mom. A-ji, why aren't you at kindergarten?\nHe's coming down with a cold, so I made him stay.\nI see.\nSo you're done handing over your work?\nWell… Today's the presentation, so I'll have to wrap that up.\nSo you won't go to work starting tomorrow, right?\nWhat? Well…\nI mean… Yes, you can say that.\nBut I guess it's totally okay to conclude that you're not incorrect.","sourceUid":"merged-mwnj4a4o-71","uid":"merged-mwnj4a4o-71","sourceNo":101,"originalSourceNo":101,"manualOrder":63,"workspaceFixedOrder":63,"lockedOrder":63,"orderLocked":true,"start":361.735,"end":443.120841,"viRange":{"start":361.735,"end":402.905},"koRange":{"start":400.930342,"end":443.120841},"viRanges":[{"start":361.735,"end":402.905}],"koRanges":[{"start":400.930342,"end":443.120841}],"speakerSegments":[{"index":0,"start":null,"end":null,"text":"어? 엄마 아지, 왜 유치원 안 갔어?","speed":1,"cueUid":"merged-mwnj4a4o-71","speakerIds":["AGENCY-024","AGENCY-005"],"speakerNames":["송아지","조은정"],"speakerLabel":"송아지, 조은정:  "},{"index":1,"start":409.881,"end":413.261,"text":"어, 감기 기운 살짝 있어서 안 보냈다","speed":1,"cueUid":"merged-mwnj4a4o-71","speakerIds":["AGENCY-005"],"speakerNames":["조은정"],"speakerLabel":"조은정:  "},{"index":2,"start":414.091,"end":415.339,"text":"아, 그래요?","speed":1,"cueUid":"merged-mwnj4a4o-71","speakerIds":["AGENCY-005"],"speakerNames":["조은정"],"speakerLabe function play(kind,i=cur,token=++tok){return new Promise(async res=>{let r=getRange(kind,i);if(!r)return res();try{let a=await prepareEngine(kind,r.start);let end=Number(r.end||0);let done=false;let cleanup=()=>{a.removeEventListener('timeupdate',check);a.removeEventListener('ended',ended);a.removeEventListener('error',errored)};let finish=()=>{if(done)return;done=true;cleanup();a.pause();res()};let check=()=>{if(done)return;if(token!==tok||!flow&&token!==tok)return finish();if(a.currentTime>=end-0.03)finish()};let ended=()=>finish();let errored=()=>finish();a.addEventListener('timeupdate',check);a.addEventListener('ended',ended,{once:true});a.addEventListener('error',errored,{once:true});setMsg(`Đang phát ${kind.toUpperCase()} Cue #${label(blocks[i]||{},i)} ${fmt(r.start)} → ${fmt(r.end)}`);try{await a.play();}catch(e){cleanup();if(isIOS()&&!unlocked){alert('iPhone cần unlock audio trước. Bấm Unlock iPhone Audio rồi thử lại.')}else{alert('Không phát được audio: '+(e&&e.message?e.message:e));}return res()}setTimeout(check,80)}catch(e){alert(e.message||e);res()}})}
function playCurrent(k){stopAll(false);tok++;play(k,cur,tok)}
function sequenceFor(mode){if(mode==='vi')return['vi'];if(mode==='ko')return['ko'];if(mode==='vi-ko-vi')return['vi','ko','vi'];return['vi','ko']}
async function smart(){let token=++tok;flow=true;if(isIOS()&&!unlocked){let ok=await unlockAudio(false);if(!ok){alert('Trên iPhone, hãy bấm Unlock iPhone Audio trước, sau đó bấm Smart Flow.');flow=false;return}}let mode=$('mode').value, seq=sequenceFor(mode);for(let i=cur;i<blocks.length&&token===tok&&flow;i++){cur=i;render();document.querySelector('.seg.active')?.scrollIntoView({block:'center'});for(const k of seq){if(token!==tok||!flow)break;await play(k,i,token)}}if(token===tok)setMsg('Smart Flow đã dừng/kết thúc')}
function stopAll(inc=true){if(inc)tok++;flow=false;via.pause();koa.pause();engine.pause();setMsg('Đã stop')}
function next(){cur=Math.min(blocks.length-1,cur+1);render()}function prev(){cur=Math.max(0,cur-1);render()}
$('viaf').onchange=e=>{let f=e.target.files[0];if(f){via.src=URL.createObjectURL(f);applyVisibleVolume('vi');if(!engine.src){engine.src=via.src;engineKind='vi';applyEngineVolume('vi')}unlocked=false;setMsg('Đã chọn VI audio. Nếu dùng iPhone, bấm Unlock.')}};
$('koaf').onchange=e=>{let f=e.target.files[0];if(f){koa.src=URL.createObjectURL(f);applyVisibleVolume('ko');unlocked=false;setMsg('Đã chọn KO audio. Nếu dùng iPhone, bấm Unlock.')}};
function tryAuto(){let vu=candidateUrls('vi')[0], ku=candidateUrls('ko')[0]; if(vu)via.src=vu; if(ku)koa.src=ku; applyVisibleVolume('vi');applyVisibleVolume('ko'); try{via.load();koa.load();}catch(e){} setMsg('Đã khai báo audio từ GitHub. Nếu iPhone chưa nghe, chờ vài giây rồi bấm Unlock/Smart Flow.')}initReaderVolumeControls();tryAuto();
(function addIphoneButtons(){let row=document.querySelector('.float .row');if(row){let b=document.createElement('button');b.textContent='Unlock iPhone Audio';b.className='warn';b.onclick=()=>unlockAudio(true);row.insertBefore(b,row.children[3]||null);let d=document.createElement('button');d.textContent='Audio paths';d.onclick=()=>showAudioPaths();row.appendChild(d);}})();
render();</script><style id="ostCueStyle">.ostCueBox{margin:10px 0;padding:12px;border:1px solid #c4b5fd;border-left:5px solid #7c3aed;border-radius:13px;background:#faf5ff;color:#292044}.ostCueHead{font-size:14px;font-weight:850;overflow-wrap:anywhere}.ostCueMeta{font-size:12px;color:#6b21a8;margin:4px 0}.ostCueBtn{background:#7c3aed!important;color:white!important;border:0!important;border-radius:9px;padding:8px 12px;cursor:pointer;margin:6px 0}.ostCueLyrics{margin-top:7px;border-top:1px dashed #c4b5fd;padding-top:8px;white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.6;max-height:360px;overflow:auto;font-size:14px}.ostCueLyrics b{display:block;color:#6d28d9;margin-bottom:4px}.ostCueBox details summary{cursor:pointer;font-weight:750;color:#6d28d9;margin-top:5px}.ostCueBox audio{width:100%}.ostCueFile{max-width:100%;font-size:12px}.ostCueStatus{font-size:12px;color:#64748b}</style><script id="ostCuePatch">(function(){
const get=(x)=>document.getElementById(x);
const clean=(v)=>String(v==null?'':v);
const escapeHtml=(v)=>clean(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const norm=(v)=>clean(v).replace(/\\/g,'/').replace(/^\/+|\/+$/g,'');
const tracks=(project.musicTracks||project.tracks||[]);
const audio=document.createElement('audio');audio.controls=true;audio.preload='metadata';audio.style.width='100%';
let stopAt=null,activeId=null,localUrl=null;
function trackOf(m){return tracks.find(t=>t.id===m.trackId)||tracks[0]||{};}
function candidates(m){const t=trackOf(m),file=norm(t.file||project.musicAudioFile),folder=norm(project.musicFolder||'../music');if(!file)return [];if(/^https?:\/\//i.test(file))return [file];return [...new Set([folder+'/'+file,'../music/'+file,'music/'+file,'../'+file,file])].map(x=>encodeURI(x));}
function srcFor(m){let arr=candidates(m),index=0;if(!arr.length)return;audio.onerror=()=>{index++;if(index<arr.length){audio.src=arr[index];audio.load();}else{const el=get('ostCueStatus');if(el)el.textContent='Chưa tìm thấy file nhạc. Chọn MP3 bên dưới hoặc kiểm tra đường dẫn GitHub.';}};audio.src=arr[0];audio.load();}
window.ostCuePlay=function(i){const b=(project.blocks||project.items||[])[i],m=b&&b.music;if(!m)return;const id=clean(m.trackId||'default');if(activeId!==id){activeId=id;if(!localUrl)srcFor(m);}const host=get('ostCueAudioHost');if(host)host.appendChild(audio);stopAt=Number(m.end);const start=Number(m.start)||0;const run=()=>{try{audio.currentTime=start}catch(e){}audio.play().catch(()=>{const el=get('ostCueStatus');if(el)el.textContent='Không phát được nhạc. Hãy chọn file MP3 hoặc kiểm tra đường dẫn.';});};if(audio.readyState>=1)run();else audio.addEventListener('loadedmetadata',run,{once:true});};
audio.addEventListener('timeupdate',()=>{if(stopAt!=null&&audio.currentTime>=stopAt){audio.pause();stopAt=null;}});
window.ostCueLoadFile=function(input){const f=input.files&&input.files[0];if(!f)return;if(localUrl)URL.revokeObjectURL(localUrl);localUrl=URL.createObjectURL(f);audio.onerror=null;audio.src=localUrl;audio.load();const el=get('ostCueStatus');if(el)el.textContent='Đã chọn '+f.name;};
function cueMusic(b){if(!b)return null;return b.music||(project.musicCueData||{})[b.uid]||(project.musicCueData||{})[b.sourceUid]||null;}
function cueBox(m,i){const t=trackOf(m),title=m.title||t.title||'OST',start=Number(m.start)||0,end=Number(m.end)||0;let lines=['ko','vi','en'].filter(k=>clean(m[k]).trim()).map(k=>'<div class="ostCueLyrics"><b>'+({ko:'🇰🇷 KO',vi:'🇻🇳 VI',en:'🇬🇧 EN'}[k])+'</b>'+escapeHtml(m[k])+'</div>').join('');return '<div class="ostCueBox" onclick="event.stopPropagation()"><div class="ostCueHead">🎵 OST · '+escapeHtml(title)+'</div><div class="ostCueMeta">'+start.toFixed(3)+'s → '+end.toFixed(3)+'s</div><button class="ostCueBtn" onclick="ostCuePlay('+i+')">▶ Play OST</button><details><summary>📜 Xem lời bài hát'+(lines?'':' (chưa có Lyrics)')+'</summary>'+lines+'</details></div>';}
const orig=render;
render=function(){const result=orig.apply(this,arguments);const arr=project.blocks||project.items||[];const list=get('list');if(list){const selector=Array.isArray(project.blocks)?'.seg':'.cue';const nodes=list.querySelectorAll(selector);nodes.forEach(node=>{const match=node.getAttribute('onclick')||'',found=match.match(/cur\s*=\s*(\d+)/);let i=found?Number(found[1]):null;if(i===null&&node.id&&/^cue-\d+$/.test(node.id))i=Number(node.id.slice(4));if(i===null)return;const m=cueMusic(arr[i]);if(m){const box=document.createElement('div');box.innerHTML=cueBox(m,i);node.appendChild(box.firstElementChild);}});}return result;};
const top=get('settingsPanel')||get('settings')||document.querySelector('.top')||document.body;const bar=document.createElement('div');bar.style.cssText='background:#faf5ff;border:1px solid #ddd6fe;border-radius:12px;padding:8px;margin:6px 0';bar.innerHTML='<b>🎵 OST Player</b> <span id="ostCueStatus" class="ostCueStatus">Chọn Play OST tại cue có nhạc</span><div id="ostCueAudioHost"></div><label style="display:flex;gap:8px;align-items:center;font-size:12px;margin:7px 0">OST Vol <input id="ostCueVolume" type="range" min="0" max="100" value="70" style="flex:1;min-width:80px"><span id="ostCueVolumeText">70%</span></label><label style="display:block;font-size:12px">Nếu GitHub chưa có nhạc: <input class="ostCueFile" type="file" accept="audio/*" onchange="ostCueLoadFile(this)"></label>';top.appendChild(bar);get('ostCueAudioHost').appendChild(audio);audio.volume=.7;get('ostCueVolume').addEventListener('input',function(){audio.volume=Number(this.value)/100;get('ostCueVolumeText').textContent=this.value+'%';});render();
})();</script></body></html>
